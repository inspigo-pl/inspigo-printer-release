# Zapisuje opis najnowszego wydania do `manifest.json` w tym repozytorium.
#
# Panel czyta ten plik przez `raw.githubusercontent.com`, a NIE przez API
# GitHuba. To jest cały powód istnienia tego workflow: zapytania
# nieuwierzytelnione do API mają limit 60 na godzinę **na adres IP**, a serwery
# panelu współdzielą adresy — jeden ruchliwy dzień wyczerpałby limit wszystkim
# naraz. Surowa zawartość repozytorium takiego limitu nie ma.
#
# Ten sam wzorzec co w `inspigo-connector-releases`.
#
# Uruchamia się przy **opublikowaniu** wydania, nie przy utworzeniu szkicu.
# Szkic opisuje paczki jeszcze niepodpisane i nikt nie ma prawa ich pobrać.

name: Manifest

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  zapisz:
    runs-on: ubuntu-latest

    steps:
      # `ref: main` jest konieczne. Przy zdarzeniu `release` domyślny checkout
      # ustawia ODŁĄCZONY HEAD na znaczniku wydania, a wtedy `git push` kończy
      # się „You are not currently on a branch" — po udanym commicie, więc
      # przebieg wygląda na działający aż do ostatniej linii.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Składam manifest z najnowszego wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `--json` bierze wydanie opublikowane, nie szkic — dokładnie to,
          # co widzi człowiek wchodzący na stronę wydań.
          gh release view --repo "${{ github.repository }}" \
            --json tagName,publishedAt,assets \
            --jq '{
              wersja: .tagName,
              opublikowano: .publishedAt,
              pliki: [
                .assets[]
                | select(.name | test("\\.(exe|msi|dmg|AppImage|deb|rpm)$"))
                | { nazwa: .name, url: .url, rozmiarBajtow: .size }
              ]
            }' > manifest.json

          echo "--- manifest.json"
          cat manifest.json

      - name: Zapisuję, jeśli się zmienił
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git add` MUSI być przed sprawdzeniem. `git diff` porównuje drzewo
          # robocze z indeksem i o pliku NIEŚLEDZONYM nic nie wie — przy
          # pierwszym uruchomieniu zgłaszał brak zmian i manifest nigdy nie
          # powstawał, mimo zielonego przebiegu.
          git add manifest.json

          if git diff --cached --quiet; then
            echo "Manifest bez zmian."
            exit 0
          fi

          git commit -m "chore: manifest najnowszego wydania"

          # Gałąź podana wprost: gdyby checkout kiedykolwiek znowu wylądował
          # w odłączonym HEAD, push ma nadal wiedzieć, dokąd pisać.
          git push origin HEAD:main
