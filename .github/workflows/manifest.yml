# Zapisuje opis najnowszego wydania do `manifest.json` w tym repozytorium.
#
# Panel czyta ten plik przez `raw.githubusercontent.com`, a NIE przez API
# GitHuba. To jest cały powód istnienia tego workflow: zapytania
# nieuwierzytelnione do API mają limit 60 na godzinę **na adres IP**, a serwery
# panelu współdzielą adresy — jeden ruchliwy dzień wyczerpałby limit wszystkim
# naraz. Surowa zawartość repozytorium takiego limitu nie ma.
#
# Ten sam wzorzec co w `inspigo-connector-releases`.
#
# Uruchamia się przy **opublikowaniu** wydania, nie przy utworzeniu szkicu.
# Szkic opisuje paczki jeszcze niepodpisane i nikt nie ma prawa ich pobrać.

name: Manifest

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  zapisz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Składam manifest z najnowszego wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `--json` bierze wydanie opublikowane, nie szkic — dokładnie to,
          # co widzi człowiek wchodzący na stronę wydań.
          gh release view --repo "${{ github.repository }}" \
            --json tagName,publishedAt,assets \
            --jq '{
              wersja: .tagName,
              opublikowano: .publishedAt,
              pliki: [
                .assets[]
                | select(.name | test("\\.(exe|msi|dmg|AppImage|deb|rpm)$"))
                | { nazwa: .name, url: .url, rozmiarBajtow: .size }
              ]
            }' > manifest.json

          echo "--- manifest.json"
          cat manifest.json

      - name: Zapisuję, jeśli się zmienił
        run: |
          set -euo pipefail

          if git diff --quiet -- manifest.json; then
            echo "Manifest bez zmian."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: manifest najnowszego wydania"
          git push
