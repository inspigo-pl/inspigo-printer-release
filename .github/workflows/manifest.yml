# Zapisuje dwa pliki opisujące najnowsze wydanie:
#
#   * `manifest.json` — dla strony pobierania w panelu,
#   * `latest.json`   — dla automatycznej aktualizacji aplikacji.
#
# Oba powstają przy PUBLIKACJI, nie przy utworzeniu szkicu. Dla `latest.json`
# jest to warunek konieczny: sygnatura dla Windows powstaje dopiero po
# podpisaniu instalatora certyfikatem, czyli już po zbudowaniu paczek.
#
# Panel czyta ten plik przez `raw.githubusercontent.com`, a NIE przez API
# GitHuba. To jest cały powód istnienia tego workflow: zapytania
# nieuwierzytelnione do API mają limit 60 na godzinę **na adres IP**, a serwery
# panelu współdzielą adresy — jeden ruchliwy dzień wyczerpałby limit wszystkim
# naraz. Surowa zawartość repozytorium takiego limitu nie ma.
#
# Ten sam wzorzec co w `inspigo-connector-releases`.
#
# Uruchamia się przy **opublikowaniu** wydania, nie przy utworzeniu szkicu.
# Szkic opisuje paczki jeszcze niepodpisane i nikt nie ma prawa ich pobrać.

name: Manifest

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  zapisz:
    runs-on: ubuntu-latest

    steps:
      # `ref: main` jest konieczne. Przy zdarzeniu `release` domyślny checkout
      # ustawia ODŁĄCZONY HEAD na znaczniku wydania, a wtedy `git push` kończy
      # się „You are not currently on a branch" — po udanym commicie, więc
      # przebieg wygląda na działający aż do ostatniej linii.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Składam manifest z najnowszego wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `--json` bierze wydanie opublikowane, nie szkic — dokładnie to,
          # co widzi człowiek wchodzący na stronę wydań.
          gh release view --repo "${{ github.repository }}" \
            --json tagName,publishedAt,assets \
            --jq '{
              wersja: .tagName,
              opublikowano: .publishedAt,
              pliki: [
                .assets[]
                | select(.name | test("\\.(exe|msi|dmg|AppImage|deb|rpm)$"))
                | { nazwa: .name, url: .url, rozmiarBajtow: .size }
              ]
            }' > manifest.json

          echo "--- manifest.json"
          cat manifest.json

      - name: Składam plik aktualizacji
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          znacznik=$(jq -r .wersja manifest.json)
          wersja="${znacznik#v}"

          # Sygnatury są małe (kilkaset bajtów), więc pobieramy je w całości
          # i wklejamy do pliku. Updater porównuje je z pobraną paczką.
          gh release download "$znacznik" --repo "${{ github.repository }}" \
            --pattern "*.sig" --dir sygnatury --clobber || true

          # Klucze platform w formacie OS-ARCH, którego oczekuje updater.
          # Paczka aktualizacji to NIE to samo co instalator: na macOS jest to
          # archiwum `.app.tar.gz`, na Linuksie AppImage, na Windows instalator.
          # `.deb` i `.rpm` updater nie obsługuje — kto instaluje z paczki
          # systemowej, aktualizuje się ręcznie.
          platformy=$(gh release view "$znacznik" --repo "${{ github.repository }}" \
            --json assets --jq '
              [ .assets[]
                | select(.name | test("\\.(exe|AppImage|app\\.tar\\.gz)$"))
                | {
                    klucz: (
                      if   .name | test("setup\\.exe$")     then "windows-x86_64"
                      elif .name | test("app\\.tar\\.gz$") then "darwin-aarch64"
                      elif .name | test("aarch64\\.AppImage$") then "linux-aarch64"
                      elif .name | test("AppImage$")          then "linux-x86_64"
                      else empty end
                    ),
                    nazwa: .name,
                    url: .url
                  }
              ]')

          echo "$platformy" | jq -c '.[]' | while read -r wpis; do
            nazwa=$(echo "$wpis" | jq -r .nazwa)
            if [ ! -f "sygnatury/${nazwa}.sig" ]; then
              echo "::warning::brak sygnatury dla $nazwa — ta platforma nie dostanie aktualizacji"
            fi
          done

          jq -n \
            --arg wersja "$wersja" \
            --arg data "$(jq -r .opublikowano manifest.json)" \
            --argjson platformy "$platformy" \
            '{
              version: $wersja,
              pub_date: $data,
              platforms: (
                $platformy
                | map(select(.klucz != null))
                | map({ (.klucz): { url: .url } })
                | add // {}
              )
            }' > latest.json

          # Sygnatury dopisujemy osobno, bo jq nie czyta plików w środku mapy.
          for plik in sygnatury/*.sig; do
            [ -e "$plik" ] || continue
            nazwa=$(basename "$plik" .sig)
            klucz=$(echo "$platformy" | jq -r --arg n "$nazwa" '.[] | select(.nazwa == $n) | .klucz')
            [ -n "$klucz" ] && [ "$klucz" != "null" ] || continue

            jq --arg k "$klucz" --arg s "$(cat "$plik")" \
              '.platforms[$k].signature = $s' latest.json > latest.tmp
            mv latest.tmp latest.json
          done

          rm -rf sygnatury

          echo "--- latest.json"
          jq '.platforms | keys' latest.json

      - name: Zapisuję, jeśli się zmienił
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git add` MUSI być przed sprawdzeniem. `git diff` porównuje drzewo
          # robocze z indeksem i o pliku NIEŚLEDZONYM nic nie wie — przy
          # pierwszym uruchomieniu zgłaszał brak zmian i manifest nigdy nie
          # powstawał, mimo zielonego przebiegu.
          git add manifest.json latest.json

          if git diff --cached --quiet; then
            echo "Manifest bez zmian."
            exit 0
          fi

          git commit -m "chore: opis najnowszego wydania"

          # Gałąź podana wprost: gdyby checkout kiedykolwiek znowu wylądował
          # w odłączonym HEAD, push ma nadal wiedzieć, dokąd pisać.
          git push origin HEAD:main
